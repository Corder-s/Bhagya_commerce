server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  config:
    activate:
      on-profile: staging

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 2
      pool-name: BhagyaStagingHikariCP

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health,info

bhagya:
  cors:
    allowed-origins:
      - ${FRONTEND_URL:https://staging.bhagya.commerce}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allow-credentials: true
  payment:
    provider: ${PAYMENT_PROVIDER:mock}
    key-id: ${PAYMENT_KEY_ID:rzp_test_staging}
    key-secret: ${PAYMENT_KEY_SECRET:staging_secret}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:staging_webhook}
