name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # -------------------------------------------------------------
  # Job 1: Frontend Verification (Next.js 16 + TypeScript)
  # -------------------------------------------------------------
  frontend-ci:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Build Next.js production bundle
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
        run: npm run build

  # -------------------------------------------------------------
  # Job 2: Backend Verification (Spring Boot 3.4.3 + Java 21)
  # -------------------------------------------------------------
  backend-ci:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run Backend Unit & Integration Tests
        working-directory: ./backend
        run: mvn clean test

      - name: Build Spring Boot Production JAR
        working-directory: ./backend
        run: mvn package -DskipTests

  # -------------------------------------------------------------
  # Job 3: Production Docker Image Verification
  # -------------------------------------------------------------
  docker-ci:
    name: Docker Multi-Stage Build Check
    runs-on: ubuntu-latest
    needs: [ backend-ci ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build API Docker Image
        run: docker build -t bhagya-commerce-api:ci ./backend
